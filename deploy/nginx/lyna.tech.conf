# Copy of /etc/nginx/sites-available/lyna.tech on the server, kept here for history.
# Not deployed automatically: after changing it, install by hand (see README, "Настройки nginx").
#
# The server file is shared: it also holds the HTTP redirect and the app.lyna.tech
# block, which belong to the app. This repo owns only the "Landing" block below.
# Before editing, take the current file from the server, so changes to the app part are not lost.

# Requests by bare IP or unknown Host: drop the connection
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP: only Let's Encrypt challenges, everything else goes to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name lyna.tech app.lyna.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS for bare IP or unknown names: refuse the TLS handshake
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Landing: static files uploaded by GitHub Actions (personal-crm-landing repo)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lyna.tech;

    ssl_certificate     /etc/letsencrypt/live/lyna.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyna.tech/privkey.pem;

    # Security headers. "always" adds them to error pages (404) too.
    # A location with its own add_header drops all of these: repeat them there.
    #
    # HTTPS only for a year. Without includeSubDomains: subdomains belong to the app.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Everything comes from this site. Inline scripts and styles are allowed
    # (the page has an inline <style>), so no nonce is needed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    # No embedding in frames on other sites (old browsers; new ones use frame-ancestors)
    add_header X-Frame-Options "DENY" always;
    # Other sites (the app too) see only "https://lyna.tech", not the full address
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    # The page needs none of these browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    root /var/www/lyna.tech;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# App: container from /opt/crm/prod (docker compose project "prod") on 127.0.0.1:3000
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.lyna.tech;

    ssl_certificate     /etc/letsencrypt/live/lyna.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyna.tech/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
